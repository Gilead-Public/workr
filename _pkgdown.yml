url: https://gilead-public.github.io/workr

template:
  bootstrap: 5
  bootswatch: yeti
  includes:
    in_header: '<link href="pkgdown/extra.css" rel="stylesheet">'

development:
  mode: auto

navbar:
  structure:
    left: [articles, reference, slides, news]
    right: [search, github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/gilead-biostats/workr
    articles:
      text: Vignettes
      menu:
      - text: "Intro to {workr} (US Phuse Connect 2026)"
        href: articles/Overview.html
      - text: "Load and Save Hooks"
        href: articles/load-save-hooks.html
      - text: "Pharmaverse Case Study"
        href: articles/Pharmaverse.html
      - text: "Cookbook: sdtm.oak"
        href: articles/SDTM_example.html
      - text: "Cookbook: admiral"
        href: articles/ADAM_example.html
      - text: "Cookbook: viz libs"
        href: articles/gsm_visualizations.html
      - text: "Cookbook: cards"
        href: articles/ARS_example.html
    slides:
      text: Slides
      href: slides/

reference:
  - title: "Workflow Execution"
    desc: "Core functions for running workflows and individual steps."
    contents:
      - RunWorkflows
      - RunWorkflow
      - RunStep
      - RunQuery
  - title: "Project Management"
    desc: "Project workflow helpers, phase configuration, and bundled examples."
    contents:
      - loadExample
      - gsm_datasim_provider
      - register_load_provider
      - register_save_provider
      - FilterWorkflows
      - ListWorkflows
      - ListWorkflowNames
      - MakeWorkflowList
      - RunProject
  - title: "Demo App"
    desc: "Interactive Shiny application for exploring workflows."
    contents:
      - DemoApp_init
      - DemoApp_UI
      - DemoApp_Server
      - sum_step
  - title: "Internal / Helpers"
    contents:
      - gh_get_sha
      - gh_get_version
      - parse_github_ref
      - pkgListFromManifest
      - pkgManifest
      - pull_workflows
      - resolve_package
      - resolve_ref_by_date
      - resolve_tag_by_date
      - write_rproject_toml
