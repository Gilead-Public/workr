meta:
  Type: Analysis
  ID: kri0002
  GroupLevel: Site
  Abbreviation: SAE
  Metric: Serious Adverse Event Rate
  Model: Poisson
  Score: Residual
  AnalysisType: rate
  Threshold: -7,-5,5,7
  AccrualThreshold: 500
  Priority: 2
spec:
  Mapped_AE:
    subjid:
      type: character
    aeser:
      type: character
  Mapped_SUBJ:
    subjid:
      type: character
    invid:
      type: character
    timeonstudy:
      type: integer
steps:
  - output: vThreshold
    name: qual_parse_threshold
    params:
      strThreshold: Threshold
  - output: Temp_SAE
    name: workr::RunQuery
    params:
      df: Mapped_AE
      strQuery: "SELECT * FROM df WHERE aeser = 'Y'"
  - output: Analysis_Input
    name: qual_input_rate
    params:
      dfSubjects: Mapped_SUBJ
      dfNumerator: Temp_SAE
      strSubjectCol: subjid
      strGroupCol: invid
      strGroupLevel: GroupLevel
      strDenominatorCol: timeonstudy
  - output: Analysis_Transformed
    name: qualification_transform_counts
    params:
      dfInput: Analysis_Input
      countCol: Numerator
      exposureCol: Denominator
      GroupID: GroupID
  - output: Analysis_Analyzed
    name: qualification_analyze_poisson
    params:
      dfTransformed: Analysis_Transformed
  - output: Analysis_Flagged
    name: qualification_flag_poisson
    params:
      dfAnalyzed: Analysis_Analyzed
      threshold: vThreshold
  - output: Analysis_Summary
    name: qual_summarize
    params:
      dfFlagged: Analysis_Flagged
      nAccrualThreshold: AccrualThreshold
