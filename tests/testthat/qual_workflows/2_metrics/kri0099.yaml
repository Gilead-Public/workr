meta:
  Type: Analysis
  ID: kri0099
  GroupLevel: Site
  Abbreviation: AE
  Metric: Retired Adverse Event Rate
  Model: Normal Approximation
  Score: Adjusted Z-Score
  AnalysisType: rate
  Threshold: -2,-1,2,3
  AccrualThreshold: 500
  Priority: 2
  Active: false
spec:
  Mapped_AE:
    subjid:
      type: character
    aeser:
      type: character
  Mapped_SUBJ:
    subjid:
      type: character
    invid:
      type: character
    timeonstudy:
      type: integer
steps:
  - output: vThreshold
    name: qual_parse_threshold
    params:
      strThreshold: Threshold
  - output: Analysis_Input
    name: qual_input_rate
    params:
      dfSubjects: Mapped_SUBJ
      dfNumerator: Mapped_AE
      strSubjectCol: subjid
      strGroupCol: invid
      strGroupLevel: GroupLevel
      strDenominatorCol: timeonstudy
  - output: Analysis_Transformed
    name: qualification_transform_counts
    params:
      dfInput: Analysis_Input
      countCol: Numerator
      exposureCol: Denominator
      GroupID: GroupID
  - output: Analysis_Analyzed
    name: qualification_analyze_normalapprox
    params:
      dfTransformed: Analysis_Transformed
      strType: AnalysisType
  - output: Analysis_Flagged
    name: qualification_flag_normalapprox
    params:
      dfAnalyzed: Analysis_Analyzed
      threshold: vThreshold
  - output: Analysis_Summary
    name: qual_summarize
    params:
      dfFlagged: Analysis_Flagged
      nAccrualThreshold: AccrualThreshold
